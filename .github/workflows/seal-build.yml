name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: GO111MODULE=off go build -v .

      - name: Prepare module zip helper
        run: |
          mkdir -p "$RUNNER_TEMP/modzip"
          cd "$RUNNER_TEMP/modzip"
          cat > main.go <<'EOF'
          package main

          import (
          	"log"
          	"os"

          	"golang.org/x/mod/module"
          	"golang.org/x/mod/zip"
          )

          func main() {
          	if len(os.Args) != 5 {
          		log.Fatal("usage: modzip <module-path> <version> <source-dir> <output-zip>")
          	}
          	m := module.Version{Path: os.Args[1], Version: os.Args[2]}
          	f, err := os.Create(os.Args[4])
          	if err != nil {
          		log.Fatal(err)
          	}
          	defer f.Close()
          	if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
          		log.Fatal(err)
          	}
          	log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          go mod init modzip
          go get golang.org/x/mod@v0.14.0
          go build -o "$RUNNER_TEMP/modzip-bin" .

      - name: Pack module zip
        run: |
          # This workflow file is CI plumbing, not part of the module.
          rm -f .github/workflows/seal-build.yml
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/modzip-bin" github.com/Masterminds/goutils v1.1.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v1.1.0.zip"
          unzip -l "$RUNNER_TEMP/out/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: go-module-zip
          path: ${{ runner.temp }}/out/v1.1.0.zip
          if-no-files-found: error
